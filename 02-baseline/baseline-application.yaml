apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc1-baseline-no-kueue
  labels:
    app: spark-contention-poc
    poc/test-case: tc1-baseline
  namespace: spark-notebook
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: "4.0.1"
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkConf:
    spark.executor.instances: "2"
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    instances: 4
    cores: 1
    memory: 512m
    securityContext: {}
  restartPolicy:
    type: Never